<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASM 性能对比测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h2 { font-size: 18px; margin-bottom: 15px; color: #333; }
    button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result { margin-top: 15px; padding: 10px; background: #f9f9f9; border-left: 3px solid #007bff; border-radius: 4px; }
    .result p { margin: 5px 0; font-size: 14px; }
    .loading { display: inline-block; width: 12px; height: 12px; border: 2px solid #f3f3f3; border-top: 2px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .comparison { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .comparison h2 { margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f5f5f5; font-weight: 600; }
    .fastest { background: #d4edda; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 WASM 性能对比测试</h1>

    <div class="grid">
      <div class="card">
        <h2>1️⃣ 斐波那契数列</h2>
        <p>递归密集型计算 (fib(35))</p>
        <button onclick="runFibonacci()">运行测试</button>
        <div id="fib-result"></div>
      </div>

      <div class="card">
        <h2>2️⃣ 快速排序</h2>
        <p>内存操作 (100,000 个数)</p>
        <button onclick="runQuickSort()">运行测试</button>
        <div id="sort-result"></div>
      </div>

      <div class="card">
        <h2>3️⃣ 矩阵乘法</h2>
        <p>计算密集型 (512×512)</p>
        <button onclick="runMatrixMul()">运行测试</button>
        <div id="matrix-result"></div>
      </div>

      <div class="card">
        <h2>4️⃣ 字符串处理</h2>
        <p>文本处理 (单词频率)</p>
        <button onclick="runWordFreq()">运行测试</button>
        <div id="word-result"></div>
      </div>
    </div>

    <div class="comparison">
      <h2>📊 性能对比</h2>
      <table id="comparison-table">
        <thead>
          <tr>
            <th>测试项</th>
            <th>Rust (ms)</th>
            <th>Go (ms)</th>
            <th>C++ (ms)</th>
          </tr>
        </thead>
        <tbody id="comparison-body">
          <tr><td colspan="4" style="text-align: center; color: #999;">运行测试后显示结果</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    const results = {};

    function showLoading(id) {
      document.getElementById(id).innerHTML = '<div class="loading"></div> 运行中...';
    }

    function showResult(id, data) {
      const html = Object.entries(data)
        .map(([lang, time]) => `<p><strong>${lang}:</strong> ${time.toFixed(2)} ms</p>`)
        .join('');
      document.getElementById(id).innerHTML = `<div class="result">${html}</div>`;
    }

    window.runFibonacci = async () => {
      showLoading('fib-result');
      const data = {};

      try {
        // Rust
        const rustMod = await import('@wasm-lang-test/rust');
        const start = performance.now();
        rustMod.fibonacci(35);
        data['Rust'] = performance.now() - start;
      } catch (e) { data['Rust'] = 'Error'; }

      try {
        // Go
        const goMod = await import('@wasm-lang-test/go');
        const start = performance.now();
        // Go WASM 调用方式
        data['Go'] = performance.now() - start;
      } catch (e) { data['Go'] = 'Error'; }

      try {
        // C++
        const cppMod = await import('@wasm-lang-test/cpp');
        const start = performance.now();
        // C++ WASM 调用方式
        data['C++'] = performance.now() - start;
      } catch (e) { data['C++'] = 'Error'; }

      results['fibonacci'] = data;
      showResult('fib-result', data);
      updateComparison();
    };

    window.runQuickSort = async () => {
      showLoading('sort-result');
      const data = {};
      const arr = Array.from({length: 100000}, () => Math.random() * 1000000 | 0);

      try {
        const rustMod = await import('@wasm-lang-test/rust');
        const start = performance.now();
        rustMod.quick_sort(new Int32Array(arr));
        data['Rust'] = performance.now() - start;
      } catch (e) { data['Rust'] = 'Error'; }

      results['quickSort'] = data;
      showResult('sort-result', data);
      updateComparison();
    };

    window.runMatrixMul = async () => {
      showLoading('matrix-result');
      const data = {};

      try {
        const rustMod = await import('@wasm-lang-test/rust');
        const start = performance.now();
        rustMod.matrix_multiply(512);
        data['Rust'] = performance.now() - start;
      } catch (e) { data['Rust'] = 'Error'; }

      results['matrixMul'] = data;
      showResult('matrix-result', data);
      updateComparison();
    };

    window.runWordFreq = async () => {
      showLoading('word-result');
      const data = {};
      const text = 'the quick brown fox jumps over the lazy dog '.repeat(10000);

      try {
        const rustMod = await import('@wasm-lang-test/rust');
        const start = performance.now();
        rustMod.word_frequency(text);
        data['Rust'] = performance.now() - start;
      } catch (e) { data['Rust'] = 'Error'; }

      results['wordFreq'] = data;
      showResult('word-result', data);
      updateComparison();
    };

    function updateComparison() {
      const tbody = document.getElementById('comparison-body');
      if (Object.keys(results).length === 0) return;

      let html = '';
      for (const [test, data] of Object.entries(results)) {
        const testName = {
          'fibonacci': '斐波那契',
          'quickSort': '快速排序',
          'matrixMul': '矩阵乘法',
          'wordFreq': '字符串处理'
        }[test];

        html += `<tr>
          <td>${testName}</td>
          <td>${typeof data['Rust'] === 'number' ? data['Rust'].toFixed(2) : data['Rust']}</td>
          <td>${typeof data['Go'] === 'number' ? data['Go'].toFixed(2) : data['Go']}</td>
          <td>${typeof data['C++'] === 'number' ? data['C++'].toFixed(2) : data['C++']}</td>
        </tr>`;
      }
      tbody.innerHTML = html;
    }
  </script>
</body>
</html>
