<!--
  ╔════════════════════════════════════════════════════════════════════════════╗
  ║                   WASM 性能对比测试 - HTML 结构文件                          ║
  ╚════════════════════════════════════════════════════════════════════════════╝

  本文件定义了整个应用的 HTML 结构，包括：

  1. 页面元数据和样式引入
     - 字符编码设置 (UTF-8)
     - 视口配置 (响应式设计)
     - 外部 CSS 样式表引入

  2. 测试卡片网格布局
     - 四个独立的测试卡片容器
     - 每个卡片包含测试名称、描述、运行按钮和结果显示区域
     - 使用 CSS Grid 实现响应式布局

  3. 性能对比表格
     - 汇总所有测试结果
     - 支持五种语言 (Rust, Go, C++, Dart, Kotlin)
     - 动态更新表格内容

  4. JavaScript 模块加载
     - 引入 main.js 作为 ES6 模块
     - 处理所有交互逻辑和 WASM 模块加载

  ═══════════════════════════════════════════════════════════════════════════
  关键特性：
  - 响应式设计：自适应不同屏幕尺寸
  - 模块化结构：HTML、CSS、JavaScript 分离
  - 性能测试：支持四种不同类型的算法测试
  - 实时对比：即时显示五种语言的性能差异
  ═══════════════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 字符编码和视口设置 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 页面标题 -->
  <title>WASM 性能对比测试</title>

  <!-- 引入外部样式表 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 主容器 -->
  <div class="container">
    <!-- 页面标题 -->
    <h1>🚀 WASM 性能对比测试</h1>

    <!-- 测试卡片网格布局 -->
    <div class="grid">
      <!-- 测试 1: 斐波那契数列 (递归密集型) -->
      <div class="card">
        <h2>1️⃣ 斐波那契数列</h2>
        <p>递归密集型计算 (fib(35))</p>
        <button onclick="runFibonacci()">运行测试</button>
        <div id="fib-result"></div>
      </div>

      <!-- 测试 2: 快速排序 (内存操作) -->
      <div class="card">
        <h2>2️⃣ 快速排序</h2>
        <p>内存操作 (100,000 个数)</p>
        <button onclick="runQuickSort()">运行测试</button>
        <div id="sort-result"></div>
      </div>

      <!-- 测试 3: 矩阵乘法 (计算密集型) -->
      <div class="card">
        <h2>3️⃣ 矩阵乘法</h2>
        <p>计算密集型 (512×512)</p>
        <button onclick="runMatrixMul()">运行测试</button>
        <div id="matrix-result"></div>
      </div>

      <!-- 测试 4: 字符串处理 (文本处理) -->
      <div class="card">
        <h2>4️⃣ 字符串处理</h2>
        <p>文本处理 (单词频率)</p>
        <button onclick="runWordFreq()">运行测试</button>
        <div id="word-result"></div>
      </div>
    </div>

    <!-- 性能对比表格 -->
    <div class="comparison">
      <h2>📊 性能对比</h2>
      <!-- 对比表格: 显示五种语言 (Rust, Go, C++, Dart, Kotlin) 的性能数据 -->
      <table id="comparison-table">
        <thead>
          <tr>
            <th>测试项</th>
            <th>Rust (ms)</th>
            <th>Go (ms)</th>
            <th>C++ (ms)</th>
            <th>Dart (ms)</th>
            <th>Kotlin (ms)</th>
          </tr>
        </thead>
        <tbody id="comparison-body">
          <tr><td colspan="6" style="text-align: center; color: #999;">运行测试后显示结果</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 引入主要 JavaScript 模块 -->
  <script type="module" src="main.js"></script>
</body>
</html>
