<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASM 性能对比测试</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🚀 WASM 性能对比测试</h1>

    <div class="grid">
      <div class="card">
        <h2>1️⃣ 斐波那契数列</h2>
        <p>递归密集型计算 (fib(35))</p>
        <button onclick="runFibonacci()">运行测试</button>
        <div id="fib-result"></div>
      </div>

      <div class="card">
        <h2>2️⃣ 快速排序</h2>
        <p>内存操作 (100,000 个数)</p>
        <button onclick="runQuickSort()">运行测试</button>
        <div id="sort-result"></div>
      </div>

      <div class="card">
        <h2>3️⃣ 矩阵乘法</h2>
        <p>计算密集型 (512×512)</p>
        <button onclick="runMatrixMul()">运行测试</button>
        <div id="matrix-result"></div>
      </div>

      <div class="card">
        <h2>4️⃣ 字符串处理</h2>
        <p>文本处理 (单词频率)</p>
        <button onclick="runWordFreq()">运行测试</button>
        <div id="word-result"></div>
      </div>
    </div>

    <div class="comparison">
      <h2>📊 性能对比</h2>
      <table id="comparison-table">
        <thead>
          <tr>
            <th>测试项</th>
            <th>Rust (ms)</th>
            <th>Go (ms)</th>
            <th>C++ (ms)</th>
          </tr>
        </thead>
        <tbody id="comparison-body">
          <tr><td colspan="4" style="text-align: center; color: #999;">运行测试后显示结果</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
